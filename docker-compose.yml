services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: clinivue-postgres

    environment:
      POSTGRES_USER: clinivue
      POSTGRES_DB: clinivue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - clinivue_postgres_data:/var/lib/postgresql/data

volumes:
  clinivue_postgres_data:
